<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PixelPress OS - Sovereign Stable</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --text: #e2e8f0;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --danger: #ef4444;
      --success: #22c55e;
      --warning: #f59e0b;
      --border: #334155;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.5);
    }

    [data-theme="dark-obsidian"] {
      --bg: #000000;
      --panel: #0a0a0a;
      --text: #d4d4d4;
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
      --border: #262626;
    }

    [data-theme="cyber-neon"] {
      --bg: #0a0a12;
      --panel: #11111a;
      --text: #00ffcc;
      --accent: #ff00ff;
      --accent-hover: #d400d4;
      --border: #00ffcc40;
      --shadow: 0 0 10px #00ffcc40;
    }

    [data-theme="sunset-glow"] {
      --bg: #1c1917;
      --panel: #292524;
      --text: #fef3c7;
      --accent: #f97316;
      --accent-hover: #ea580c;
      --border: #44403c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; padding: 20px; transition: background 0.3s, color 0.3s; }
    
    .os-container {
      width: 100%; max-width: 900px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.5rem; letter-spacing: 1px; }
    .theme-selector select {
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
      padding: 6px 10px; border-radius: 6px; cursor: pointer;
    }

    main { padding: 20px; display: grid; gap: 20px; grid-template-columns: 1fr 1fr; }
    @media (max-width: 700px) { main { grid-template-columns: 1fr; } }

    .panel { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 15px; }
    .panel h2 { font-size: 1.1rem; margin-bottom: 12px; color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 6px; }

    .hud-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center; }
    .hud-item { padding: 10px; background: var(--panel); border-radius: 6px; }
    .hud-val { font-size: 1.4rem; font-weight: bold; margin: 4px 0; }
    .hud-label { font-size: 0.8rem; opacity: 0.8; }

    .controls { display: flex; gap: 10px; margin-top: 10px; justify-content: center; }
    button {
      background: var(--accent); color: white; border: none; padding: 8px 14px;
      border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.2s;
    }
    button:hover { background: var(--accent-hover); transform: translateY(-1px); }
    button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    button.secondary { background: var(--panel); border: 1px solid var(--border); color: var(--text); }
    button.danger { background: var(--danger); }

    .queue-list, .history-list { list-style: none; max-height: 120px; overflow-y: auto; margin-top: 8px; }
    .queue-list li, .history-list li {
      padding: 6px; background: var(--panel); margin-bottom: 4px; border-radius: 4px;
      display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem;
    }
    .status-badge { font-size: 0.7rem; padding: 2px 6px; border-radius: 10px; background: var(--accent); color: white; }
    .status-done { background: var(--success); }
    .status-error { background: var(--danger); }

    .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 0.85rem; opacity: 0.9; }
    select, input[type="number"] {
      background: var(--panel); color: var(--text); border: 1px solid var(--border);
      padding: 6px; border-radius: 4px;
    }

    .alert-box {
      grid-column: 1 / -1;
      background: rgba(239, 68, 68, 0.15); border: 1px solid var(--danger);
      padding: 15px; border-radius: 8px; text-align: center;
      animation: pulse 2s infinite;
    }
    .alert-box.hidden { display: none; }
    @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.4); } 50% { box-shadow: 0 0 0 10px rgba(239,68,68,0); } }

    .execute-btn {
      grid-column: 1 / -1; width: 100%; padding: 14px; font-size: 1.1rem;
      background: linear-gradient(135deg, var(--accent), var(--accent-hover));
      box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
    }
    .progress-bar { height: 4px; background: var(--border); border-radius: 2px; margin-top: 8px; overflow: hidden; display: none; }
    .progress-fill { height: 100%; background: var(--success); width: 0%; transition: width 0.3s; }

    #fileInput { display: none; }
    .upload-label {
      display: inline-block; background: var(--panel); border: 1px dashed var(--border);
      padding: 10px; text-align: center; border-radius: 6px; cursor: pointer; width: 100%; margin-bottom: 8px;
    }
    .upload-label:hover { border-color: var(--accent); }
  </style>
</head>
<body data-theme="blue-horizon">
  <div class="os-container">
    <header>
      <h1>🎨 PIXELPRESS OS</h1>
      <div class="theme-selector">
        <label for="theme">Appearance: </label>
        <select id="theme">
          <option value="blue-horizon">Blue Horizon</option>
          <option value="dark-obsidian">Dark Obsidian</option>
          <option value="cyber-neon">Cyber Neon</option>
          <option value="sunset-glow">Sunset Glow</option>
        </select>
      </div>
    </header>

    <main>
      <!-- Hardware HUD -->
      <div class="panel">
        <h2>Hardware HUD</h2>
        <div class="hud-grid">
          <div class="hud-item"><div class="hud-label">🌡️ TEMP</div><div class="hud-val" id="tempVal">24°C</div></div>
          <div class="hud-item"><div class="hud-label">💧 INK</div><div class="hud-val" id="inkVal">100%</div></div>
          <div class="hud-item"><div class="hud-label">📄 PAPER</div><div class="hud-val" id="paperVal">50</div></div>
        </div>
        <div class="controls">
          <button id="soundBtn" class="secondary">🔈 Sound</button>
          <button id="resetBtn" class="secondary">🔄 Reset</button>
        </div>
      </div>

      <!-- File Center -->
      <div class="panel">
        <h2>File Center</h2>
        <label for="fileInput" class="upload-label">+ UPLOAD FILE</label>
        <input type="file" id="fileInput" multiple>
        <ul id="queueList" class="queue-list"><li style="opacity:0.5">Queue empty.</li></ul>
      </div>

      <!-- Print History -->
      <div class="panel">
        <h2>Print History</h2>
        <ul id="historyList" class="history-list"><li style="opacity:0.5">No history.</li></ul>
      </div>

      <!-- Settings -->
      <div class="panel">
        <h2>Precision Job Settings</h2>
        <div class="settings-grid">
          <div class="form-group">
            <label>Copies</label>
            <input type="number" id="copies" min="1" max="10" value="1">
          </div>
          <div class="form-group">
            <label>Watermark</label>
            <select id="watermark">
              <option value="None">None</option>
              <option value="Confidential">Confidential</option>
              <option value="Draft">Draft</option>
              <option value="Top Secret">Top Secret</option>
            </select>
          </div>
          <div class="form-group">
            <label>Type</label>
            <select id="printType">
              <option value="Color">Color</option>
              <option value="B&W">B & W</option>
            </select>
          </div>
          <div class="form-group">
            <label>Quality</label>
            <select id="quality">
              <option value="Draft">Draft</option>
              <option value="Standard" selected>Standard</option>
              <option value="Ultra">Ultra</option>
            </select>
          </div>
        </div>
        <div class="controls" style="margin-top:15px; justify-content: space-between;">
          <button id="loadPaperBtn">Load Paper</button>
          <button id="refillInkBtn">Refill Ink</button>
        </div>
      </div>

      <!-- Alert Area -->
      <div id="alertBox" class="alert-box">
        🚨 MECHANICAL GEAR PROBLEM! 🚨<br>
        <button id="fixGearBtn" class="danger" style="margin-top:8px;">FIX GEARS</button>
      </div>

      <!-- Execute -->
      <button id="executeBtn" class="execute-btn" disabled>EXECUTE SYSTEM PRINT</button>
      <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
    </main>
  </div>

  <script>
    // State Management
    const state = {
      temp: 24,
      ink: 100,
      paper: 50,
      soundOn: true,
      gearsFixed: false,
      queue: [],
      history: [],
      isPrinting: false
    };

    // DOM Elements
    const els = {
      temp: document.getElementById('tempVal'),
      ink: document.getElementById('inkVal'),
      paper: document.getElementById('paperVal'),
      soundBtn: document.getElementById('soundBtn'),
      resetBtn: document.getElementById('resetBtn'),
      fileInput: document.getElementById('fileInput'),
      queueList: document.getElementById('queueList'),
      historyList: document.getElementById('historyList'),
      copies: document.getElementById('copies'),
      watermark: document.getElementById('watermark'),
      printType: document.getElementById('printType'),
      quality: document.getElementById('quality'),
      loadPaper: document.getElementById('loadPaperBtn'),
      refillInk: document.getElementById('refillInkBtn'),
      alertBox: document.getElementById('alertBox'),
      fixGear: document.getElementById('fixGearBtn'),
      execute: document.getElementById('executeBtn'),
      progressBar: document.getElementById('progressBar'),
      progressFill: document.getElementById('progressFill'),
      theme: document.getElementById('theme')
    };

    // Initialize
    function init() {
      updateHUD();
      updateQueueUI();
      updateHistoryUI();
      els.soundBtn.textContent = state.soundOn ? '🔈 Sound On' : '🔇 Sound Off';
      checkPrintReadiness();
    }

    // Update HUD
    function updateHUD() {
      els.temp.textContent = `${state.temp}°C`;
      els.ink.textContent = `${state.ink}%`;
      els.paper.textContent = state.paper;
    }

    // Queue Management
    function updateQueueUI() {
      els.queueList.innerHTML = '';
      if (state.queue.length === 0) {
        els.queueList.innerHTML = '<li style="opacity:0.5">Queue empty.</li>';
        return;
      }
      state.queue.forEach((file, idx) => {
        const li = document.createElement('li');
        li.innerHTML = `<span>${file.name}</span><button class="secondary" onclick="removeFromQueue(${idx})">✕</button>`;
        els.queueList.appendChild(li);
      });
    }

    window.removeFromQueue = (idx) => {
      state.queue.splice(idx, 1);
      updateQueueUI();
      checkPrintReadiness();
    };

    // File Upload
    els.fileInput.addEventListener('change', (e) => {
      Array.from(e.target.files).forEach(file => {
        state.queue.push(file);
      });
      e.target.value = ''; // reset input
      updateQueueUI();
      checkPrintReadiness();
      playBeep();
    });

    // Theme Switcher
    els.theme.addEventListener('change', (e) => {
      document.body.setAttribute('data-theme', e.target.value);
    });

    // Sound Toggle
    els.soundBtn.addEventListener('click', () => {
      state.soundOn = !state.soundOn;
      els.soundBtn.textContent = state.soundOn ? '🔈 Sound On' : '🔇 Sound Off';
    });

    // Reset
    els.resetBtn.addEventListener('click', () => {
      state.queue = [];
      state.history = [];
      state.copies = 1;
      els.copies.value = 1;
      els.watermark.value = 'None';
      els.printType.value = 'Color';
      els.quality.value = 'Standard';
      updateQueueUI();
      updateHistoryUI();
      checkPrintReadiness();
    });

    // Maintenance Buttons
    els.loadPaper.addEventListener('click', () => {
      state.paper += 50;
      updateHUD();
      playBeep();
    });

    els.refillInk.addEventListener('click', () => {
      state.ink = 100;
      updateHUD();
      playBeep();
    });

    // Fix Gears
    els.fixGear.addEventListener('click', () => {
      state.gearsFixed = true;
      els.alertBox.classList.add('hidden');
      playBeep();
      checkPrintReadiness();
    });

    // Check Print Readiness
    function checkPrintReadiness() {
      const ready = state.queue.length > 0 && state.paper > 0 && state.ink > 0 && state.gearsFixed && !state.isPrinting;
      els.execute.disabled = !ready;
      els.execute.textContent = ready ? 'EXECUTE SYSTEM PRINT' : '⚠️ SYSTEM NOT READY';
    }

    // Execute Print
    els.execute.addEventListener('click', async () => {
      if (state.queue.length === 0) return;
      
      state.isPrinting = true;
      els.execute.disabled = true;
      els.progressBar.style.display = 'block';
      els.progressFill.style.width = '0%';

      const job = state.queue.shift();
      const copies = parseInt(els.copies.value) || 1;
      const settings = { wm: els.watermark.value, type: els.printType.value, qual: els.quality.value };

      // Simulate Print Process
      for (let i = 1; i <= 100; i += 10) {
        await new Promise(r => setTimeout(r, 200));
        els.progressFill.style.width = `${i}%`;
        state.temp = 24 + Math.floor(Math.random() * 5); // Simulate temp fluctuation
        updateHUD();
      }

      // Consume Resources
      const inkCost = settings.qual === 'Ultra' ? 8 : settings.qual === 'Standard' ? 5 : 2;
      state.ink = Math.max(0, state.ink - (inkCost * copies));
      state.paper = Math.max(0, state.paper - copies);
      state.temp = 26 + Math.floor(Math.random() * 4); // Post-print cool down baseline

      updateHUD();
      updateQueueUI();

      // Add to History
      state.history.unshift({
        file: job.name,
        copies,
        settings,
        status: 'Completed',
        time: new Date().toLocaleTimeString()
      });
      updateHistoryUI();

      state.isPrinting = false;
      els.progressBar.style.display = 'none';
      els.progressFill.style.width = '0%';
      playBeep();
      checkPrintReadiness();
    });

    // History UI
    function updateHistoryUI() {
      els.historyList.innerHTML = '';
      if (state.history.length === 0) {
        els.historyList.innerHTML = '<li style="opacity:0.5">No history.</li>';
        return;
      }
      state.history.forEach(item => {
        const li = document.createElement('li');
        li.innerHTML = `
          <div>
            <strong>${item.file}</strong> (${item.copies}x)<br>
            <small>${item.settings.type} | ${item.settings.qual}</small>
          </div>
          <span class="status-badge status-done">${item.time}</span>
        `;
        els.historyList.appendChild(li);
      });
    }

    // Sound Feedback
    function playBeep() {
      if (!state.soundOn) return;
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = 600;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.1, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.1);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.1);
    }

    // Init on load
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
